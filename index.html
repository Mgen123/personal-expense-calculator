<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>💰 Personal Expense Calculator</h1>
        
        <!-- Income Section -->
        <div class="section">
            <h2>Add Income</h2>
            <div class="input-group">
                <input type="number" id="incomeInput" placeholder="Enter income amount">
                <button onclick="addIncome()">Add Income</button>
            </div>
            <div id="incomeList"></div>
        </div>

        <!-- Expense Section -->
        <div class="section">
            <h2>Add Expense</h2>
            <div class="input-group">
                <input type="text" id="expenseName" placeholder="Expense name">
                <input type="number" id="expenseAmount" placeholder="Amount">
                <select id="expenseCategory">
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Bills">Bills</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Other">Other</option>
                </select>
                <button onclick="addExpense()">Add Expense</button>
            </div>
            <div id="expenseList"></div>
        </div>

        <!-- Summary Section -->
        <div class="section summary">
            <h2>Summary</h2>
            <div class="summary-grid">
                <div class="summary-item">
                    <h3>Total Income</h3>
                    <p id="totalIncome">$0.00</p>
                </div>
                <div class="summary-item">
                    <h3>Total Expenses</h3>
                    <p id="totalExpenses">$0.00</p>
                </div>
                <div class="summary-item">
                    <h3>Remaining Balance</h3>
                    <p id="remainingBalance">$0.00</p>
                </div>
            </div>
        </div>

        <!-- Expenses by Category -->
        <div class="section">
            <h2>Expenses by Category</h2>
            <div id="categorySummary"></div>
        </div>
    </div>

    <script src="dist/index.js"></script>
</body>
</html>
